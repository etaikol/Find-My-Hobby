server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: flask-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: flask-backend
          __path__: /var/log/flask-backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            msg: message
            time: asctime
